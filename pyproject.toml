[project]
name = "mcp-switcher"
version = "0.1.0"
description = "Simple MCP configuration switcher CLI tool"
authors = [{ name = "MCP Switcher", email = "noreply@example.com" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.0.0",
    "pipx>=1.7.1",
]

[project.scripts]
mcp-switch = "mcp_switcher.main:app"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
